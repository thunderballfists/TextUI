name: Tests and packaging

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated Poetry
        run: pipx install poetry==2.4.3
      - name: Install locked project and tests
        run: |
          poetry env use "$(command -v python)"
          poetry check --lock
          poetry install --with test --no-interaction
      - name: Run headless suite
        run: poetry run python -m pytest -q
      - name: Build distributions
        run: poetry build
      - name: Verify clean wheel installation outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/textui-wheel"
          "$RUNNER_TEMP/textui-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/textui-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/textui-wheel/bin/python" -I "$GITHUB_WORKSPACE/tests/wheel_smoke.py"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint Python sources
        run: pipx run pyflakes textui

  visual:
    runs-on: ubuntu-24.04
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      TEXTUI_VISUAL_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install isolated Poetry
        run: pipx install poetry==2.4.3
      - name: Install locked project and tests
        run: |
          poetry env use "$(command -v python)"
          poetry check --lock
          poetry install --with test --no-interaction
      - name: Compare reviewed visual baselines
        run: poetry run python -m pytest tests/visual -q
      - name: Regenerate platform baseline after a visual failure
        if: failure()
        run: poetry run python -m pytest tests/visual -q --snapshot-update
      - name: Upload reviewed SVG baselines after a visual failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: textui-visual-baselines
          path: tests/visual/__snapshots__/**/*.svg
          if-no-files-found: error

  compatibility:
    name: Textual compatibility (${{ matrix.policy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        policy: [lowest, latest]
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      TEXTUAL_POLICY: ${{ matrix.policy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel with isolated Poetry
        run: |
          pipx install poetry==2.4.3
          poetry env use "$(command -v python)"
          poetry check --lock
          poetry install --with test --no-interaction
          poetry build
      - name: Resolve independent Textual policy in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/textui-compatibility"
          textual_constraint=()
          if [ "$TEXTUAL_POLICY" = lowest ]; then
            textual_constraint=("textual==8.2.8")
          fi
          "$RUNNER_TEMP/textui-compatibility/bin/python" -m pip install \
            dist/*.whl "${textual_constraint[@]}" \
            "pytest>=9.1.1,<10" "pytest-asyncio>=1.4.0,<2"
          "$RUNNER_TEMP/textui-compatibility/bin/python" -m pip check
      - name: Run installed behavioral probes and wheel integration
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/textui-compatibility/bin/python" -I \
            "$GITHUB_WORKSPACE/tests/compatibility_smoke.py" "$TEXTUAL_POLICY"
          "$RUNNER_TEMP/textui-compatibility/bin/python" -I \
            "$GITHUB_WORKSPACE/tests/wheel_smoke.py"

  platform:
    name: Platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install isolated Poetry and locked tests
        run: |
          python -m pip install pipx
          python -m pipx run --spec poetry==2.4.3 poetry env use "$(python -c 'import sys; print(sys.executable)')"
          python -m pipx run --spec poetry==2.4.3 poetry check --lock
          python -m pipx run --spec poetry==2.4.3 poetry install --with test --no-interaction
      - name: Run platform-focused headless tests
        run: |
          python -m pipx run --spec poetry==2.4.3 poetry run python -m pytest -q \
            tests/test_clipboard.py tests/test_project.py \
            tests/test_project_cli.py tests/test_project_check.py \
            tests/test_project_app.py tests/test_project_timers.py \
            tests/test_modal_lifecycle.py tests/test_accelerators.py \
            tests/test_platform_smoke.py
      - name: Build distributions
        run: python -m pipx run --spec poetry==2.4.3 poetry build
      - name: Verify installed wheel and native clipboard outside checkout
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import venv

          root = Path(os.environ["GITHUB_WORKSPACE"])
          directory = Path(os.environ["RUNNER_TEMP"]) / "textui-platform"
          venv.create(directory, with_pip=True)
          executable = directory / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          wheels = list((root / "dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          subprocess.run([str(executable), "-m", "pip", "install", str(wheels[0])], check=True)
          subprocess.run([str(executable), "-m", "pip", "check"], check=True)
          for script in ("wheel_smoke.py", "platform_smoke.py"):
              subprocess.run([str(executable), "-I", str(root / "tests" / script)], cwd=directory, check=True)
          PY
