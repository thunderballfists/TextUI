[project]
name = "textui"
version = "0.2.1"
description = "Strict XML documents, native TCSS, and explicit Python actions for Textual apps"
authors = [{ name = "thunderballfists", email = "apb@beihl.com" }]
readme = "README.md"
requires-python = ">=3.11,<4"
license = "MIT"
dependencies = [
    "textual>=8.2.8,<9",
    "lxml>=6.1.3,<7",
]

[project.scripts]
textui = "textui.__main__:main"

[tool.poetry]
packages = [{ include = "textui" }]
include = [
    { path = "examples", format = "sdist" },
    { path = "docs/migration.md", format = "sdist" },
]

[tool.poetry.group.test.dependencies]
pytest = ">=9.1.1,<10"
pytest-asyncio = ">=1.4.0,<2"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[build-system]
requires = ["poetry-core>=2.4,<3"]
build-backend = "poetry.core.masonry.api"
