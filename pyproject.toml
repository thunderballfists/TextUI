[project]
name = "textui-markup"
version = "0.7.0"
description = "Declarative, HTML-like markup for Textual apps: widgets, TCSS styles, and Python actions"
authors = [{ name = "thunderballfists", email = "apb@beihl.com" }]
readme = "README.md"
requires-python = ">=3.11,<4"
license = "MIT"
keywords = ["textual", "tui", "markup", "declarative", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=8.2.8,<9",
    "lxml>=6.1.3,<7",
]

[project.urls]
Homepage = "https://github.com/thunderballfists/TextUI"
Documentation = "https://github.com/thunderballfists/TextUI/blob/main/README.md"
Repository = "https://github.com/thunderballfists/TextUI"
Issues = "https://github.com/thunderballfists/TextUI/issues"
Changelog = "https://github.com/thunderballfists/TextUI/blob/main/CHANGELOG.md"

[project.scripts]
textui = "textui.__main__:main"

[tool.poetry]
packages = [{ include = "textui" }]
include = [
    { path = "showcase", format = "sdist" },
    { path = "poetry.lock", format = "sdist" },
    { path = "examples", format = "sdist" },
    { path = "docs", format = "sdist" },
]

[tool.poetry.group.test.dependencies]
pytest = ">=9.1.1,<10"
pytest-asyncio = ">=1.4.0,<2"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[build-system]
requires = ["poetry-core>=2.4,<3"]
build-backend = "poetry.core.masonry.api"
